# bbxb.conf: the settings of the framework, for every project and platform of this checkout.
#
# This file is the template: bbxb reads ./bbxb.conf only (gitignored), so copy it first:
#   cp configurations/bbxb.conf bbxb.conf
# and uncomment what you change. Every line below shows the default the framework uses when the
# variable is not set: a commented line changes nothing.
#
# Precedence: environment > bbxb.conf > platforms/<platform>.conf > setenv, then
# <PRJ_PATH>/<project>.conf and the .prj itself, which can override any of them before the first
# build ("OPTLEVEL=3 ./bbxb build lfs rpi3-aarch64" works for one run). The names assigned here,
# commented or not, are also the ones that travel to the container of a --container build
# (container_env_names in container.functions): a setting the framework reads belongs here.
#
# A package already built is not rebuilt when one of these changes: its status is the checksum of
# its recipe. After changing the optimization, LTO, the toolchain or the library types, empty the
# platform (bbxb purge <project> <platform>) or rebuild with build --force.

###### Data and containers
### Where downloads, toolchains, sources, sysroots and images go (several GiB per platform)
# DATA_PATH=/mnt/bbcrossbuild/datadir
### Run every build inside the container of this checkout (bbxb --container; --no-container turns
### it off for one run). The image is built when docker lacks it or the Dockerfile changed; the
### checkout and DATA_PATH are mounted at their host paths
# CONTAINER_BUILD=0
### The registry "bbxb container push" pushes the image to, as <registry>/<image>. The credentials
### are the ones of "docker login <registry>", run once: none goes here
# CONTAINER_REGISTRY=ghcr.io/<user>
### The docker build cache "bbxb container build" exports and every later build imports
# BBXB_CACHE_DIR=/var/cache/bbcrossbuild-docker
### The size of the sccache cache (DATA_PATH/cache/sccache) every compiler call goes through
# SCCACHE_CACHE_SIZE=16G
######

###### Directories
### Of the checkout: the recipes, the platform files, the projects (PRJ_PATH: absolute, or relative
### to the checkout; PRJ_DIR is the name when PRJ_PATH is unset), the images
# PKG_DIR=packages
# PLATFORM_DIR=platforms
# PRJ_PATH=projects
# PRJ_DIR=projects
# IMG_DIR=images
### Under DATA_PATH: the global ones
# DOWNLOAD_DIR=downloads
# CACHE_DIR=cache
### Under DATA_PATH/<project> (sources, user data) and DATA_PATH/<project>/<platform> (the rest)
# SRC_DIR=sources
# USERDATA_DIR=data
# DISTOS_DIR=distos
# BLD_DIR=builds
# BIN_DIR=binaries
# LOG_DIR=logs
# STATUS_DIR=status
# TOOLCHAIN_DIR=toolchain
# DISKIMAGES_DIR=diskimages
# PACKAGES_DIR=packages
######

###### Toolchain
### The compilers of the target builds: gnu (gcc, g++) or llvm (clang, clang++, built by
### setup_full_toolchain with the cross gcc)
# TOOLCHAIN=gnu
### The linker: bfd or mold with gnu, lld or mold with llvm. mold is not the one of the host:
### setup_full_toolchain builds lfs/mold:cross when one of the two is mold
# GCC_DEFAULT_LD=bfd
# LLVM_DEFAULT_LD=lld
### The threads of one link (mold, gold, the ThinLTO jobs of lld): a quarter of the CPUs, since make
### -j runs several links at once
# LINKPROCS=$(( $(nproc) / 4 ))
### MOLD_JOBS=1: one mold at a time, the others wait (less memory when make -j links together, the
### links of a package queued); mold reads no other value
# MOLD_JOBS=
### The C and C++ standard of what the host compiler builds (native builds, *_FOR_BUILD, the
### toolchain bootstrap): GCC 15 and later default to C23, which several GNU packages do not build
### with. HOST_CXXSTD stays empty for the gcc 16 sources; -std=gnu++11 for gcc 14
# HOST_CSTD=-std=gnu17
# HOST_CXXSTD=
### Extra flags of every target build, by toolchain: compiler and linker
# GNU_EXTRAGCCFLAGS=
# GNU_EXTRALDFLAGS=
# LLVM_EXTRACLANGFLAGS=
# LLVM_EXTRALDFLAGS=
### LLVM Polly (TOOLCHAIN=llvm), a list of: polly (the optimizer), vectorizer (polly-vectorizer=
### stripmine), parallel (polly-parallel, not for the kernel), all (the three)
# LLVM_POLLY_FEATURES=
### The versions of the toolchain packages: the defaults are in their recipes
### (packages/lfs/<name>/package.env, GCC_VER=${GCC_VER:-<version>}), a value here or in the
### project overrides them. gcc, binutils, glibc and gdb have patches per version: a version
### without them builds unpatched (utilities/update_patches makes them)
# BINUTILS_VER=
# GCC_VER=
# GLIBC_VER=
# LLVM_VER=
# PYTHON_VER=
# PERL_VER=
# AUTOCONFARCHIVE_VER=
# KERNEL_VER=
######

###### Packages
### The optimization level of the packages: 0, 1, 2, 3 or s, the -O of the compilers and of the link
### (the LTO back end), the opt-level of cargo, the target libraries of gcc (libstdc++...). glibc
### builds with at least 2
# OPTLEVEL=2
### LTO of the target packages: 0 (off), 1 or fat, 2 or thin
# LTOENABLE=0
### Extra C, C++ and Fortran flags of every build, before the -O of OPTLEVEL and the LTO flags,
### which settcenv adds (-pipe, -fno-semantic-interposition...)
# OPTCOMP_FLAGS=
### Extra linker flags of every build (LDFLAGS: -Wl,-O1, -Wl,-z,relro -Wl,-z,now...), before the
### -O of OPTLEVEL, which the LTO back end reads at link time
# OPTLINK_FLAGS=
### Optional rustc flags of every build (RUSTFLAGS), after the ones of the platform (-C codegen-units=1)
# OPTCOMP_RUSTFLAGS=
### Debug builds: -g, and OPTLEVEL 2 (PKG_DEBUG=1 in a recipe does it for one package)
# DEBUG=0
### The libraries the packages install: shared (1/0), static (1/0). With LTO and static libraries
### the objects are fat, their bytecode removed after the build (strip_lto_objects in build.functions)
# BUILD_LIBSHARED=1
# BUILD_LIBSTATIC=1
### The compiler and make command lines in the logs of the packages (0 or 1)
# MAKEVERBOSE=0
######

###### The cross gcc (lfs/gcc:cross)
### The optimization level of its host programs (gcc, cc1, the driver); empty: OPTLEVEL
# GCC_OPTLEVEL=
### LTO of its host programs: 0 or 1
# GCC_LTOENABLE=0
######

###### Kernel
### The optimization level of the kernel: 2 (CC_OPTIMIZE_FOR_PERFORMANCE), 3 (the same patched to
### -O3), s (CC_OPTIMIZE_FOR_SIZE)
# KERNEL_OPTLEVEL=2
### LTO of the kernel (clang only): 0 (off), 1 or lto (full), 2 or thin
# KERNEL_LTOENABLE=0
### Optional ld flags of the kernel, added to its KBUILD_LDFLAGS (with LTO and KERNEL_OPTLEVEL 3 the
### build adds --lto-O3)
# KERNEL_OPTLINK_FLAGS=
######

###### Layout of the target
### Debian-style multiarch library directories (lib/<triple>) when the platform sets no HARCH_LIB
# MULTIARCH=1
### The install directories of the image
# TARGET_PREFIX=/usr
# TARGET_EXECPREFIX=/usr
# TARGET_INCLUDEDIR=/usr/include
# TARGET_LIBDIR=/usr/lib<HARCH_LIB>
# TARGET_SYSCONFDIR=/etc
# TARGET_LOCALSTATEDIR=/var
# TARGET_SHAREDIR=/usr/share
######

###### Certificates (create_key_sscertificate in data.functions)
### The name of the key and the subject of the self-signed certificate under DATA_PATH/<project>/data/pki
# PKI_KEY_NAME=$(whoami)
# PKI_SUBJECT="/CN=$(whoami)/emailAddress=$(whoami)@$(uname -n)"
######
