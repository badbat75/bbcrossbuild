### Default values for lfs project
# LFS_TOOLCHAIN=gnu
# LFS_SPLITUSR=0
# WITH_NSCD=0
# LFS_ENABLESSH=1
# LFS_ENABLEDEV=0
# LFS_HOSTNAME=lfs
# LFS_FSTYPE=ext4
# LFS_FSSIZE=4G
# LFS_LANDEV=eth0
# LFS_WLANSSID=<SSID>
