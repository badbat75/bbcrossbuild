HOS=linux
HM=aarch64
HLIBC=gnu
#HARCH_LIB=
HARCH_BITWIDTH=64

# The Cortex-A76 of the BCM2712 is ARMv8.2-A and, unlike the Pi 3 and the Pi 4, has the crypto
# extensions: /proc/cpuinfo says "fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp
# cpuid asimdrdm lrcpc dcpop asimddp". armv8.2-a brings crc32, rdm, dcpop and the LSE atomics, which
# both compilers then write inline (a single ldaddal, no helper that checks for them at run time);
# +crypto, +fp16, +rcpc and +dotprod name the rest. No SVE, which -march must never name here
HMARCH=armv8.2-a+crypto+fp16+rcpc+dotprod
HMCPU=cortex-a76
#HMFPU=
#HMFLOATABI=
HMENDIAN=little
#HMGCCPARAMS=
#HMLDPARAMS=
HMARCH_RUST=+neon
KERNEL_ARCH=arm64
# bcm2712_defconfig: the kernel the firmware of the Pi 5 prefers over the one of bcm2711_defconfig,
# with 16 KB pages (CONFIG_LOCALVERSION "-v8-16k"). Software that assumes 4 KB pages fails on it:
# jemalloc built for them is the known case, and bind9 builds without jemalloc
KERNEL_DEFCONFIG=bcm2712_defconfig
KERNEL_LOCALVERSION=+
KERNEL_IMAGE=Image.gz
KERNEL_NAME=kernel_2712-\${KERNEL_VER}.img
KERNEL_DTBS=1

# QEMU has no Raspberry Pi 5 machine (raspi4b is the newest): no QEMU settings, so lfs.prj writes
# no command for this platform
