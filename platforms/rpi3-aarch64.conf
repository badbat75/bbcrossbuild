HOS=linux
HM=aarch64
HLIBC=gnu
#HARCH_LIB=
HARCH_BITWIDTH=64

# The Cortex-A53 of the BCM2837 (r0p4) is ARMv8.0-A with CRC32 and nothing more: /proc/cpuinfo says
# "fp asimd evtstrm crc32 cpuid". SVE arrives with ARMv8.2 and no Raspberry Pi has it: -mtune only
# chooses the scheduling, so -march was enough for the compilers to write "index z0.s" into ld.so,
# bash and systemd, and the image stopped on the first instruction of /init ("Attempted to kill
# init! exitcode=0x00000004"). The crypto extensions are optional in ARMv8.0 and the BCM2837 leaves
# them out: code that picks AES or SHA2 at compile time would stop the same way. +crc is there, and
# without it no compiler defines __ARM_FEATURE_CRC32: code that picks the CRC32 instructions at
# compile time would use its software CRC
HMARCH=armv8-a+crc
HMCPU=cortex-a53
#HMFPU=
#HMFLOATABI=
HMENDIAN=little
# -mfix-cortex-a53-835769: the erratum of the A53 up to r0p4 on a multiply-accumulate after a memory
# access. gcc works around it by default, clang only when asked (as a target feature, which ThinLTO
# keeps in the bitcode). -mno-outline-atomics: both compilers call a helper for every atomic that
# checks for the LSE instructions of ARMv8.1, which an ARMv8.0 core never has: LL/SC inline
HMGCCPARAMS="-mfix-cortex-a53-835769 -mno-outline-atomics"
# --fix-cortex-a53-843419: the erratum of the A53 up to r0p4 on an ADRP at the end of a 4 KB page
# is worked around by the linker. gcc passes the option to GNU ld by default, clang has no option
# for it and lld applies it only when told
HMLDPARAMS="-Wl,--fix-cortex-a53-843419"
# target-cpu=cortex-a53 turns on aes and sha2 in rustc, whose LLVM counts the crypto extensions in
# the A53: the BCM2837 has none
HMARCH_RUST=+neon,-aes,-sha2
#+v8a,
KERNEL_ARCH=arm64
# bcmrpi3_defconfig left the Raspberry Pi tree after rpi-6.12.y; bcm2711_defconfig covers the Pi 3 too
KERNEL_DEFCONFIG=bcm2711_defconfig
KERNEL_LOCALVERSION=+
KERNEL_IMAGE=Image.gz
KERNEL_NAME=kernel8-\${KERNEL_VER}.img
KERNEL_DTBS=1

QEMU_MACHINE=raspi3b
#QEMU_CPU=
QEMU_SMP=4
QEMU_RAM=1024
QEMU_STORAGE=sd-card
QEMU_NETWORK=usb-net
#QEMU_GRAPHIC=
QEMU_INPUT="usb-kbd usb-mouse"
QEMU_CONSOLE=ttyAMA0
QEMU_DTB=bcm2710-rpi-3-b.dtb
QEMU_KERNCONFIG="net.ifnames=0 dwc_otg.fiq_fsm_enable=0"