HOS=linux
HM=aarch64
HLIBC=gnu
#HARCH_LIB=
HARCH_BITWIDTH=64

# The Cortex-A53 of the BCM2837 is ARMv8.0-A: SVE arrives with ARMv8.2 and no Raspberry Pi has it.
# -mtune only chooses the scheduling, so -march was enough for the compilers to write "index z0.s"
# into ld.so, bash and systemd, and the image stopped on the first instruction of /init
# ("Attempted to kill init! exitcode=0x00000004", an undefined instruction at EL0)
HMARCH=armv8-a+crypto
HMCPU=cortex-a53
#HMFPU=
#HMFLOATABI=
HMENDIAN=little
#HMGCCPARAMS=
HMARCH_RUST=+neon
#+v8a,
KERNEL_ARCH=arm64
# bcmrpi3_defconfig left the Raspberry Pi tree after rpi-6.12.y; bcm2711_defconfig covers the Pi 3 too
KERNEL_DEFCONFIG=bcm2711_defconfig
KERNEL_LOCALVERSION=+
KERNEL_IMAGE=Image.gz
KERNEL_NAME=kernel8-\${KERNEL_VER}.img
KERNEL_DTBS=1

QEMU_MACHINE=raspi3b
#QEMU_CPU=
QEMU_SMP=4
QEMU_RAM=1024
QEMU_STORAGE=sd-card
QEMU_NETWORK=usb-net
#QEMU_GRAPHIC=
QEMU_INPUT="usb-kbd usb-mouse"
QEMU_CONSOLE=ttyAMA0
QEMU_DTB=bcm2710-rpi-3-b.dtb
QEMU_KERNCONFIG="net.ifnames=0 dwc_otg.fiq_fsm_enable=0"