HOS=linux
HM=aarch64
HLIBC=gnu
#HARCH_LIB=
HARCH_BITWIDTH=64

# Any ARMv8-A: the crypto extensions and CRC32 are optional in ARMv8.0 (the Pi 3 and the Pi 4 have no
# crypto), so -march names neither. The outline atomics stay: they use LSE where the core has it
HMARCH=armv8-a
HMCPU=cortex-a53
#HMFPU=
#HMFLOATABI=
HMENDIAN=little
# The errata of the Cortex-A53 up to r0p4, the core this platform is tuned for: 835769 in the
# compiler (gcc does it by default, clang when asked), 843419 in the linker (gcc passes it to GNU ld
# by default, lld only when told). Both cost next to nothing on the cores that do not need them
HMGCCPARAMS="-mfix-cortex-a53-835769"
HMLDPARAMS="-Wl,--fix-cortex-a53-843419"
# target-cpu=cortex-a53 turns on aes and sha2 in rustc, whose LLVM counts the crypto extensions in
# the A53
HMARCH_RUST=+neon,-aes,-sha2

KERNEL_ARCH=arm64
KERNEL_DEFCONFIG=defconfig
#KERNEL_EXTRAVERSION=
KERNEL_IMAGE=Image
#KERNEL_NAME=
#KERNEL_DTBS=

QEMU_MACHINE=virt
QEMU_CPU=cortex-a53
QEMU_SMP=2
QEMU_RAM=2048
QEMU_STORAGE=virtio-blk-pci
QEMU_NETWORK=virtio-net-pci
QEMU_GRAPHIC=virtio-gpu-pci,xres=1600,yres=900
QEMU_INPUT="virtio-keyboard-pci virtio-mouse-pci"
QEMU_CONSOLE=ttyAMA0
#QEMU_DTB=
QEMU_OTHERDEVICES="virtio-balloon-pci virtio-rng-pci"
QEMU_KERNCONFIG="net.ifnames=0 video=1600x900-32"