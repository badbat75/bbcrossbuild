HOS=linux
HM=arm
HLIBC=gnueabihf
#HARCH_LIB=
HARCH_BITWIDTH=32

# The Cortex-A53 of the BCM2837 has CRC32 and not the optional crypto extensions of ARMv8.0: an
# -mfpu with crypto would let code that picks AES or SHA2 at compile time stop on an undefined
# instruction, and without +crc no compiler defines __ARM_FEATURE_CRC32
HMARCH=armv8-a+crc
HMCPU=cortex-a53
HMFPU=neon-fp-armv8
HMFLOATABI=hard
HMENDIAN=little
# -mthumb: Thumb-2, the instruction set of the armhf distributions. The code of zlib is 29% smaller
# than with -marm, which a 32 KB instruction cache feels, and an in-order core runs it at the same
# speed. rustc keeps the ARM state, and the two call each other
HMGCCPARAMS="-mthumb"
# target-cpu=cortex-a53 counts the crypto extensions in the A53 for LLVM, and rustc does not know
# "crypto" as a feature: aes and sha2 are the names it takes
HMARCH_RUST=+neon,-aes,-sha2

KERNEL_ARCH=arm
KERNEL_DEFCONFIG=bcm2711_defconfig
KERNEL_LOCALVERSION=+
KERNEL_IMAGE=zImage
KERNEL_NAME=kernel7-\${KERNEL_VER}.img
KERNEL_DTBS=1
