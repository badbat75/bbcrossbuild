HOS=linux
HM=arm
HLIBC=gnueabihf
#HARCH_LIB=
HARCH_BITWIDTH=32

# armv7-a and not armv7ve: neon-vfpv4 already leaves out the Cortex-A8 and A9 (VFPv3), but the
# Cortex-A5 has VFPv4 and no integer divide instructions, so divisions stay library calls here
HMARCH=armv7-a
HMCPU=cortex-a7
HMFPU=neon-vfpv4
HMFLOATABI=hard
HMENDIAN=little
# -mthumb: Thumb-2, which every ARMv7-A core runs and the armhf distributions use. The code of zlib
# is 29% smaller than with -marm, at the same speed. rustc keeps the ARM state, and the two call
# each other
HMGCCPARAMS="-mthumb"
HMARCH_RUST=+armv7-a,+mp,+vfp4,+neon

KERNEL_ARCH=arm
KERNEL_DEFCONFIG=multi_v7_defconfig
#KERNEL_EXTRAVERSION=
KERNEL_IMAGE=bzImage
#KERNEL_NAME=
#KERNEL_DTBS=

QEMU_MACHINE=virt
QEMU_CPU=cortex-a15
QEMU_SMP=2
QEMU_RAM=1024
QEMU_STORAGE=virtio-blk-pci
QEMU_NETWORK=virtio-net-pci
QEMU_GRAPHIC=virtio-gpu-pci,xres=1600,yres=900
QEMU_INPUT="virtio-keyboard-pci virtio-mouse-pci"
QEMU_CONSOLE=ttyAMA0
#QEMU_DTB=
QEMU_OTHERDEVICES="virtio-balloon-pci virtio-rng-pci"
QEMU_KERNCONFIG="net.ifnames=0 video=1600x900-32"