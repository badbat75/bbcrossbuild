HOS=linux
HM=arm
HLIBC=gnueabihf
#HARCH_LIB=
HARCH_BITWIDTH=32

# armv7ve: the integer divide instructions are optional in ARMv7-A, and -march=armv7-a turns every
# division into a call to __aeabi_idiv or __aeabi_uidivmod. The Cortex-A7 of the BCM2836 has them
# (/proc/cpuinfo: "idiva idivt"), as the A53 of the Pi 2 v1.2 does: armv7ve (ARMv7-A with the
# virtualization extensions, LPAE and the divide instructions, the A7 exactly) writes sdiv and udiv
HMARCH=armv7ve
HMCPU=cortex-a7
HMFPU=neon-vfpv4
HMFLOATABI=hard
HMENDIAN=little
# -mthumb: Thumb-2, the instruction set of the armhf distributions. The code of zlib is 29% smaller
# than with -marm (40201 bytes against 56935), which a 32 KB instruction cache feels, and an
# in-order core runs it at the same speed. rustc keeps the ARM state, and the two call each other
HMGCCPARAMS="-mthumb"
HMARCH_RUST=+armv7-a,+mp,+vfp4

KERNEL_ARCH=arm
KERNEL_DEFCONFIG=bcm2709_defconfig
KERNEL_LOCALVERSION=+
KERNEL_IMAGE=zImage
KERNEL_NAME=kernel7-\${KERNEL_VER}.img
KERNEL_DTBS=1

QEMU_MACHINE=raspi2b
#QEMU_CPU=
QEMU_SMP=4
QEMU_RAM=1024
QEMU_STORAGE=sd-card
QEMU_NETWORK=usb-net
#QEMU_GRAPHIC=
QEMU_INPUT="usb-kbd usb-mouse"
QEMU_CONSOLE=ttyAMA0
QEMU_DTB=bcm2709-rpi-2-b.dtb
QEMU_KERNCONFIG="net.ifnames=0 dwc_otg.fiq_fsm_enable=0"