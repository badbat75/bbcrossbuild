HOS=linux
HM=arm
HLIBC=gnueabihf
#HARCH_LIB=
HARCH_BITWIDTH=32

HMARCH=armv6kz
HMCPU=arm1176jzf-s
HMFPU=vfpv2
HMFLOATABI=hard
HMENDIAN=little
# -marm: the ARM1176 has Thumb-1 only, which reaches neither the VFP nor half of the registers.
# -munaligned-access: gcc allows unaligned loads and stores from ARMv6 on by default, clang does not
# for ARMv6 on Linux (no __ARM_FEATURE_UNALIGNED); the kernel of an ARMv6 sets SCTLR.U, so both
# toolchains write word accesses where the data may be unaligned
HMGCCPARAMS="-marm -munaligned-access"
HMARCH_RUST=+armv6kz,+vfp2,+v6k

KERNEL_ARCH=arm
KERNEL_DEFCONFIG=bcmrpi_defconfig
KERNEL_EXTRAVERSION=+
KERNEL_IMAGE=zImage
KERNEL_NAME=kernel.img
KERNEL_DTBS=1

QEMU_MACHINE=raspi1ap
#QEMU_CPU=
QEMU_SMP=1
QEMU_RAM=512
QEMU_STORAGE=sd-card
### The USB network adapter of QEMU in place of the LAN95xx of the board: usbnet names it eth0 only with a
### globally administered MAC (the OUI of the Raspberry Pi), usb0 with the default 52:54:00:12:34:56
QEMU_NETWORK=usb-net,mac=b8:27:eb:12:34:56
### The framebuffer of the SoC, which the kernel finds through the mailbox of the firmware QEMU emulates
QEMU_GRAPHIC=machine
QEMU_INPUT="usb-kbd usb-mouse"
QEMU_CONSOLE=ttyAMA0
QEMU_DTB=firmware/bcm2708-rpi-b.dtb
# initcall_blacklist: raspi1ap has no ASB bridge at 0x7e00a000, the "asb" registers of the PM node in
# bcm2708-rpi-b.dtb; bcm2835-power reads its id there, takes an external abort and the oops kills the
# deferred probe worker, so the SD card never appears and rootwait waits forever
# modprobe.blacklist=cdc_subset: the usb-net of QEMU has the id of the Linux USB gadget, which cdc_ether
# and cdc_subset both match; on a slow machine cdc_subset loads first, takes the second interface as
# usb0, cdc_ether can no longer claim the device and the eth0 of the .network never appears
QEMU_KERNCONFIG="net.ifnames=0 dwc_otg.fiq_fsm_enable=0 initcall_blacklist=bcm2835_power_driver_init modprobe.blacklist=cdc_subset"