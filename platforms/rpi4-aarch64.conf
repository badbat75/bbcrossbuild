HOS=linux
HM=aarch64
HLIBC=gnu
#HARCH_LIB=
HARCH_BITWIDTH=64

# The Cortex-A72 of the BCM2711 is ARMv8.0-A with CRC32 and nothing more, like the A53 of the Pi 3:
# /proc/cpuinfo says "fp asimd evtstrm crc32 cpuid". No SVE, which arrives with ARMv8.2: with it in
# -march the compilers write SVE instructions into ordinary code, and the first one executed stops
# the boot with an undefined instruction. No crypto extensions either, optional in ARMv8.0 and left
# out of the BCM2711. +crc is there: without it no compiler defines __ARM_FEATURE_CRC32
HMARCH=armv8-a+crc
HMCPU=cortex-a72
#HMFPU=
#HMFLOATABI=
HMENDIAN=little
# -mno-outline-atomics: both compilers call a helper for every atomic that checks for the LSE
# instructions of ARMv8.1, which an ARMv8.0 core never has: LL/SC inline
HMGCCPARAMS="-mno-outline-atomics"
#HMLDPARAMS=
# target-cpu=cortex-a72 turns on aes and sha2 in rustc, whose LLVM counts the crypto extensions in
# the A72: the BCM2711 has none
HMARCH_RUST=+neon,-aes,-sha2
#+v8a,
KERNEL_ARCH=arm64
KERNEL_DEFCONFIG=bcm2711_defconfig
KERNEL_LOCALVERSION=+
KERNEL_IMAGE=Image.gz
KERNEL_NAME=kernel8-\${KERNEL_VER}.img
KERNEL_DTBS=1
