HOS=linux
HM=aarch64
HLIBC=gnu
#HARCH_LIB=
HARCH_BITWIDTH=64

# The Cortex-A72 of the BCM2711 is ARMv8.0-A, like the A53 of the Pi 3: no SVE, which arrives with
# ARMv8.2. With it in -march the compilers write SVE instructions into ordinary code, and the first
# one executed stops the boot with an undefined instruction
HMARCH=armv8-a+crypto
HMCPU=cortex-a72
#HMFPU=
#HMFLOATABI=
HMENDIAN=little
#HMGCCPARAMS=
HMARCH_RUST=+neon
#+v8a,
KERNEL_ARCH=arm64
KERNEL_DEFCONFIG=bcm2711_defconfig
KERNEL_LOCALVERSION=+
KERNEL_IMAGE=Image.gz
KERNEL_NAME=kernel8-\${KERNEL_VER}.img
KERNEL_DTBS=1
